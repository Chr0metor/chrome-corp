<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chrome Corp Discography: Discover futuristic tracks by Chrometor including Ghostmaster (Instrumental), Schwarzschild, and Stormlife on Bandcamp. Join the sleek, resilient, efficient high-trust brand minions vibe with music that inspires!">
    <meta name="keywords" content="Chrome Corp discography, high-trust brand minions, futuristic vibe, sleek resilient efficient, Chrometor music, Ghostmaster instrumental, Schwarzschild, Stormlife, Bandcamp tracks">
    <link rel="icon" href="assets/favicon.ico">
    <title>Discography - Chrome Corp</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('assets/background.jpg');
            background-repeat: repeat;
            background-size: auto;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            color: #fff;
            max-width: 1080px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 50px; /* Reduced since footer removed */
            font-weight: 300;
            font-style: italic;
        }
        #logo-overlay {
            display: block;
            margin: 20px auto;
            max-width: 450px;
            max-height: 450px;
            width: 450px;
            height: 450px;
            cursor: pointer;
        }
        h1 {
            color: #333;
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        #content {
            padding: 20px;
            text-align: center;
        }
        .track {
            margin-bottom: 40px;
        }
        .track iframe {
            width: 100%;
            max-width: 450px;
            height: auto;
            display: block;
            margin: 0 auto;
            border: none;
            min-height: 542px;
            transition: box-shadow 0.3s;
        }
        .track iframe:hover {
            box-shadow: 0 0 15px #c0c0c0;
        }
        #ad-container {
            position: fixed;
            right: 0;
            bottom: 20px;
            width: 200px;
            height: 350px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.3s;
        }
        #ad-container:hover {
            box-shadow: 0 0 15px #c0c0c0;
        }
        #ad-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #ad-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            color: #fff;
        }
        #ad-overlay.bottom {
            align-items: flex-end;
        }
        @media (max-width: 767px) {
            body {
                padding: 10px;
                max-width: 100%;
            }
            #logo-overlay {
                width: 100%;
                height: auto;
                max-height: none;
            }
            h1 {
                font-size: 48px;
            }
            .track iframe {
                max-width: 100%;
                min-height: 300px;
            }
            #ad-container {
                width: 175px;
                height: 306.25px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html"><img id="logo-overlay" src="assets/logo.png" alt="Chrome Corp Logo"></a>
    <h1>Discography</h1>
    <div id="content">
        <div class="track">
            <iframe style="border: 0; width: 450px; height: 542px;" src="https://bandcamp.com/EmbeddedPlayer/track=3031425076/size=large/bgcol=333333/linkcol=e32c14/tracklist=false/transparent=true/" seamless><a href="https://chrometor.bandcamp.com/track/ghostmaster-instrumental">Ghostmaster (Instrumental) by Chrometor</a></iframe>
        </div>
        <div class="track">
            <iframe style="border: 0; width: 450px; height: 570px;" src="https://bandcamp.com/EmbeddedPlayer/album=3635959747/size=large/bgcol=ffffff/linkcol=333333/tracklist=false/transparent=true/" seamless><a href="https://chrometor.bandcamp.com/album/schwarzschild">Schwarzschild by Chrometor</a></iframe>
        </div>
        <div class="track">
            <iframe style="border: 0; width: 450px; height: 570px;" src="https://bandcamp.com/EmbeddedPlayer/album=1241405906/size=large/bgcol=333333/linkcol=4ec5ec/tracklist=false/transparent=true/" seamless><a href="https://chrometor.bandcamp.com/album/stormlife">Stormlife by Chrometor</a></iframe>
        </div>
    </div>
    <div id="ad-container">
        <img id="ad-image" src="" alt="Ad">
        <div id="ad-overlay"></div>
    </div>
    <script>
        const ads = [
            { file: 'adverts/already-under-my-genjutsu-2.gif', text: 'FREE Disillusionment available.', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/dangerous-twerk.gif', text: 'GET BIG! ORDER NOW!', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/garage-rizz.gif', text: 'Does your Masterplan need a Master-makeover?', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/heart-giver.gif', text: '', color: '', position: '', link: '1_game.html' },
            { file: 'adverts/minion.JPG', text: 'Join Today!', color: '#fff', position: 'bottom', link: '1_join_minions.html' },
            { file: 'adverts/laugh-loop.gif', text: 'Cure DEPRESSION!', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/obelisk-merry-christmas.gif', text: 'Are you FORGETTING?', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/rose-delivery.gif', text: 'Mysterious Singles in your area.', color: '#fff', position: '', link: '1_merch.html' }
        ];
        const randomIndex = Math.floor(Math.random() * ads.length);
        const ad = ads[randomIndex];
        const adContainer = document.getElementById('ad-container');
        const adImage = document.getElementById('ad-image');
        adImage.src = ad.file;
        const overlay = document.getElementById('ad-overlay');
        overlay.innerText = ad.text;
        overlay.style.color = ad.color;
        if (ad.position === 'bottom') overlay.classList.add('bottom');
        adContainer.onclick = () => window.location.href = ad.link;
    </script>
</body>
</html>
