<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thunder Grunt News: Caveman-powered stories tied to @Chr0metor on X.com. Sleek, resilient, efficient high-trust brand minions vibe—coming soon!">
    <meta name="keywords" content="Thunder Grunt news, high-trust brand minions, futuristic vibe, sleek resilient efficient, Chrometor news, caveman news network, Grok powered news">
    <link rel="icon" href="assets/favicon.ico">
    <title>News - Chrome Corp</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('assets/background.jpg');
            background-repeat: repeat;
            background-size: auto;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            color: #fff;
            max-width: 1080px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 150px; /* Space for footer */
            font-weight: 300;
            font-style: italic;
        }
        #logo-overlay {
            display: block;
            margin: 20px auto;
            max-width: 450px;
            max-height: 450px;
            width: 450px;
            height: 450px;
            cursor: pointer;
        }
        h1 {
            color: #333;
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 40px 0;
            text-shadow: 0 0 10px #c0c0c0; /* Subtle glow for fun */
        }
        p.teaser {
            color: #c0c0c0;
            font-size: 24px;
            text-align: center;
            margin: 20px auto;
            max-width: 600px;
        }
        #social-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 10px 0;
        }
        #social-footer a {
            text-decoration: none;
            background: #333;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.3s;
            font-size: 30px;
            font-weight: bold;
            width: 50px;
            height: 50px;
        }
        #social-footer a:hover { box-shadow: 0 0 15px #c0c0c0; }
        .logo-x { color: #000; }
        .logo-youtube { color: #f00; }
        .logo-soundcloud { color: #f50; }
        .logo-bandcamp { color: #00f; }
        @media (max-width: 767px) {
            body {
                padding: 10px;
                max-width: 100%;
            }
            #logo-overlay {
                width: 100%;
                height: auto;
                max-height: none;
            }
            h1 {
                font-size: 48px;
            }
            h2 {
                font-size: 32px;
            }
            p.teaser {
                font-size: 18px;
            }
            #social-footer {
                gap: 10px;
                padding: 5px 0;
            }
            #social-footer a {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html"><img id="logo-overlay" src="assets/logo.png" alt="Chrome Corp Logo"></a>
    <h1>News</h1>
    <h2>ERROR 404 NO NEWS FOUND</h2>
    <p class="teaser">Thunder Grunt coming soon—Grok-powered caveman news tied to @Chr0metor on X.com! Stay tuned for grunt-y spins on the latest vibes.</p>
    <div id="social-footer">
        <a href="https://x.com/Chr0metor" target="_blank" class="logo-x">X</a>
        <a href="https://www.youtube.com/@chrometor" target="_blank" class="logo-youtube">Y</a>
        <a href="https://soundcloud.com/chrometor" target="_blank" class="logo-soundcloud">S</a>
        <a href="https://chrometor.bandcamp.com/" target="_blank" class="logo-bandcamp">B</a>
    </div>
</body>
</html>
