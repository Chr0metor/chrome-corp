<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="High-Trust Brand seeks worthy minions. Join Chrome Corp as a Kenku, AI Clone, Janitor, or custom character—apply now for sleek, resilient, efficient benefits!">
    <meta name="keywords" content="join Chrome Corp, join minions, high-trust brand, AI clone, Kenku, futuristic minions, Chrometor, sleek efficient benefits">
    <link rel="icon" href="assets/favicon.ico">
    <title>Minion Application - Chrome Corp</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('assets/background.jpg');
            background-repeat: repeat;
            background-size: auto;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            color: #fff;
            max-width: 1080px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 50px; /* Reduced since footer removed, but kept minimal for layout harmony */
        }
        #logo-overlay {
            display: block;
            margin: 20px auto;
            max-width: 450px;
            max-height: 450px;
            width: 450px;
            height: 450px;
            cursor: pointer;
        }
        h1 {
            color: #333;
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        p.intro {
            color: #333;
            font-size: 30px;
            text-align: center;
            font-style: italic;
            margin-bottom: 20px;
        }
        form {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 10px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-style: italic;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            font-family: 'Roboto', sans-serif;
        }
        #custom-section {
            display: none;
        }
        button {
            display: block;
            margin: 20px auto 0;
            padding: 15px 30px;
            background: #333;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 24px;
            border-radius: 5px;
            box-shadow: 0 0 10px #c0c0c0;
            transition: box-shadow 0.3s;
        }
        button:hover {
            background: #c0c0c0;
            box-shadow: 0 0 20px #c0c0c0;
            color: #000;
        }
        #great-benefits {
            position: relative;
            width: 400px; /* Matches image width */
            margin: 20px auto;
            text-align: center;
        }
        #great-benefits img {
            width: 400px;
            height: auto;
            display: block;
        }
        #great-benefits .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(51, 51, 51, 0.8); /* Shaded #333 banner */
            color: #fff;
            padding: 10px;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            border-radius: 0 0 5px 5px; /* Clipped to bottom */
        }
        @media (max-width: 767px) {
            body {
                padding: 10px;
                max-width: 100%;
            }
            #logo-overlay {
                width: 100%;
                height: auto;
                max-height: none;
            }
            form {
                padding: 10px 20px;
            }
            h1 {
                font-size: 48px;
            }
            p.intro {
                font-size: 20px;
            }
            button {
                width: 100%;
                font-size: 20px;
                padding: 12px;
            }
            #great-benefits {
                width: 100%;
            }
            #great-benefits img {
                width: 100%;
                height: auto;
            }
            #great-benefits .overlay {
                width: 100%;
                font-size: 24px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html"><img id="logo-overlay" src="assets/logo.png" alt="Chrome Corp Logo"></a>
    <h1>MINION APPLICATION</h1>
    <p class="intro">Fill out below: send your application to the CEO!</p>
    <form action="https://formspree.io/f/meolpryn" method="POST">
        <label>Minion Name:</label>
        <input type="text" name="minion_name" required>
        <label>Minion Type:</label>
        <select name="minion_type" id="minion_type">
            <option>Select...</option>
            <option>Kenku</option>
            <option>AI Clone</option>
            <option>Janitor</option>
            <option>Custom</option>
        </select>
        <div id="custom-section">
            <label>Describe your custom supportive character:</label>
            <textarea name="custom_description"></textarea>
        </div>
        <label>Email to receive minion-only newsletter:</label>
        <input type="email" name="email" required>
        <label>Most Useful Skill:</label>
        <input type="text" name="useful_skill">
        <label>Least Useful Skill:</label>
        <input type="text" name="least_useful_skill">
        <label>Why Join?</label>
        <textarea name="why_join"></textarea>
        <label>Favorite Vibe:</label>
        <input type="text" name="favorite_vibe">
        <label>Favorite Snack:</label>
        <input type="text" name="favorite_snack">
        <label>Preferred Reward:</label>
        <input type="text" name="preferred_reward">
        <input type="hidden" name="_subject" value="New Chrome Corp Minion Application!">
        <input type="text" name="_gotcha" style="display:none;">
        <button type="submit">Apply Now!</button>
    </form>
    <div id="great-benefits">
        <img src="adverts/minion.JPG" alt="Chrome Corp Minion Benefits Image">
        <div class="overlay">Great Benefits!</div>
    </div>
    <script>
        document.getElementById('minion_type').addEventListener('change', function() {
            var customSection = document.getElementById('custom-section');
            if (this.value === 'Custom') {
                customSection.style.display = 'block';
            } else {
                customSection.style.display = 'none';
            }
        });
        const form = document.querySelector('form');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    form.innerHTML = '<h2>The Boss will read your application.</h2><p>Head back to <a href="index.html">home</a> or explore <a href="1_poetry.html">poetry</a>.</p>';
                } else {
                    alert('Oopsy-daisy! Good thing nobody got hurt! Try again!?');
                }
            }).catch(error => {
                alert('Oopsy-daisy! Good thing nobody got hurt! Try again!?');
            });
        });
    </script>
</body>
</html>
