<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chrome Corp Poetry: Discover futuristic verses by Chrometor on themes of duality, shadows, and souls. Join the sleek, resilient, efficient high-trust brand minions vibe with poetic inspiration!">
    <meta name="keywords" content="Chrome Corp poetry, high-trust brand minions, futuristic vibe, sleek resilient efficient, Chrometor verses, poetry corner, duality shadows souls">
    <link rel="icon" href="assets/favicon.ico">
    <title>Poetry - Chrome Corp</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('assets/background.jpg');
            background-repeat: repeat;
            background-size: auto;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            color: #fff;
            max-width: 1080px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 50px; /* Reduced since footer removed */
            font-weight: 300;
            font-style: italic;
        }
        #logo-overlay {
            display: block;
            margin: 20px auto;
            max-width: 450px;
            max-height: 450px;
            width: 450px;
            height: 450px;
            cursor: pointer;
        }
        h1 {
            color: #333;
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .poem-section {
            width: fit-content;
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            color: #c0c0c0;
        }
        pre {
            white-space: pre-wrap;
            margin: 0 auto;
            display: inline-block;
            text-align: left;
        }
        @media (max-width: 767px) {
            body {
                padding: 10px;
                max-width: 100%;
            }
            #logo-overlay {
                width: 100%;
                height: auto;
                max-height: none;
            }
            h1 {
                font-size: 48px;
            }
            .poem-section {
                width: 100%;
                max-width: none;
                padding: 15px;
            }
            pre {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <a href="index.html"><img id="logo-overlay" src="assets/logo.png" alt="Chrome Corp Logo"></a>
    <h1>Poetry</h1>
    <div class="poem-section">
        <pre>
The heart is cage without a key.
Filled with rage, beating free.
Against the ribs it can not see.
A skeleton without doors or locks.
In a sea of cells - The mind, the docks.
        </pre>
    </div>
    <!-- All other poem sections remain the same, omitted for brevity -->
</body>
</html>
