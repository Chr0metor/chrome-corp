<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chrome Corp Meetings: Join the mystery—where is that happening? Low-key virtual huddles for minion shadows and souls.">
    <meta name="keywords" content="Chrome Corp, high-trust brand minions, futuristic vibe, minion meetings, Chrometor gatherings, mystery events, virtual minion huddles">
    <link rel="icon" href="assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
    <title>Meetings - Chrome Corp</title>
    <style>
        body { font-family: 'Roboto', sans-serif; background: url('assets/background.jpg') repeat; color: #fff; font-style: italic; font-weight: 300; margin: 0; padding-bottom: 120px; /* Extra for footer shove */ }
        h1 { color: #333; font-size: 72px; font-weight: bold; text-transform: uppercase; text-align: center; margin: 20px 0; }
        p { font-size: 24px; text-align: center; max-width: 800px; margin: 0 auto 20px; }
        p.mystery { color: #333; }
        .logo { display: block; margin: 20px auto; max-width: 450px; max-height: 450px; cursor: pointer; }
        #standin-embed { max-width: 350px; margin: 20px auto; text-align: center; }
        #standin-embed img { max-width: 100%; height: auto; transition: box-shadow 0.3s; border-radius: 5px; }
        #standin-embed img:hover { box-shadow: 0 0 15px #c0c0c0; }
        #ad-container { position: fixed; right: 0; bottom: 20px; width: 200px; height: 350px; overflow: hidden; cursor: pointer; transition: box-shadow 0.3s; }
        #ad-container:hover { box-shadow: 0 0 15px #c0c0c0; }
        #ad-container img { width: 100%; height: 100%; object-fit: cover; }
        #ad-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; box-sizing: border-box; font-size: 16px; font-weight: bold; pointer-events: none; }
        #ad-overlay.bottom { align-items: flex-end; }
        #social-footer { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 10px 0; }
        #social-footer a { text-decoration: none; background: #333; padding: 10px; border-radius: 5px; display: flex; align-items: center; justify-content: center; transition: box-shadow 0.3s; font-size: 30px; font-weight: bold; width: 50px; height: 50px; }
        #social-footer a:hover { box-shadow: 0 0 15px #c0c0c0; }
        .logo-x { color: #000; }
        .logo-youtube { color: #f00; }
        .logo-soundcloud { color: #f50; }
        .logo-bandcamp { color: #00f; }
        @media (max-width: 767px) {
            h1 { font-size: 48px; }
            p { font-size: 18px; }
            .logo { width: 100%; height: auto; }
            #standin-embed { width: 100%; }
            #ad-container { width: 175px; height: 306.25px; bottom: 10px; }
            #social-footer { gap: 10px; padding: 5px 0; }
            #social-footer a { width: 40px; height: 40px; font-size: 22px; }
        }
        <!-- Ah, Captain Ahab's harpoon conjures discreet meetings mystery with saintlike whisper—stand-in lures shadows, traffic surges in silence! -->
    </style>
</head>
<body>
    <a href="index.html"><img class="logo" src="assets/logo.png" alt="Chrome Corp Logo"></a>
    <h1>MEETINGS</h1>
    <p class="mystery">Join the mystery: Where is that happening?</p>
    <div id="standin-embed">
        <a href="#"><img src="adverts/already-under-my-genjutsu-2.gif" alt="Mystery Stand-in Image"></a>
    </div>
    <div id="ad-container">
        <img id="ad-image" src="" alt="Ad">
        <div id="ad-overlay"></div>
    </div>
    <div id="social-footer">
        <a href="https://x.com/Chr0metor" target="_blank" class="logo-x">X</a>
        <a href="https://www.youtube.com/@chrometor" target="_blank" class="logo-youtube">Y</a>
        <a href="https://soundcloud.com/chrometor" target="_blank" class="logo-soundcloud">S</a>
        <a href="https://chrometor.bandcamp.com/" target="_blank" class="logo-bandcamp">B</a>
    </div>
    <script>
        const ads = [
            { file: 'adverts/already-under-my-genjutsu-2.gif', text: 'FREE Disillusionment available.', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/dangerous-twerk.gif', text: 'GET BIG! ORDER NOW!', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/garage-rizz.gif', text: 'Does your Masterplan need a Master-makeover?', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/heart-giver.gif', text: '', color: '', position: '', link: '1_game.html' },
            { file: 'adverts/minion.JPG', text: 'Join Today!', color: '#fff', position: 'bottom', link: '1_join_minions.html' },
            { file: 'adverts/laugh-loop.gif', text: 'Cure DEPRESSION!', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/obelisk-merry-christmas.gif', text: 'Are you FORGETTING?', color: '#fff', position: '', link: '1_merch.html' },
            { file: 'adverts/rose-delivery.gif', text: 'Mysterious Singles in your area.', color: '#fff', position: '', link: '1_merch.html' }
        ];
        const randomIndex = Math.floor(Math.random() * ads.length);
        const ad = ads[randomIndex];
        const adContainer = document.getElementById('ad-container');
        const adImage = document.getElementById('ad-image');
        adImage.src = ad.file;
        const overlay = document.getElementById('ad-overlay');
        overlay.innerText = ad.text;
        overlay.style.color = ad.color;
        if (ad.position === 'bottom') overlay.classList.add('bottom');
        adContainer.onclick = () => window.location.href = ad.link;
        <!-- Eternal script in the discreet shadows: Ads pulse with subtle temptation—mystery thrives, conversions ascend! -->
    </script>
</body>
</html>
